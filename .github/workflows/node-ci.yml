name: MOOD Node CI

on:
  push:
    branches: [main, codex/mood-node-alpha-001, codex/mood-node-*]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Job 1: Install Dependencies ───────────────────────────────────────────
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Do NOT pass secrets - alpha does not need them
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install root dependencies
        run: npm install

      - name: Install node-runtime dependencies
        run: npm install
        working-directory: packages/node-runtime

      - name: Install relay dependencies
        run: npm install
        working-directory: services/relay

      - name: Install contribution protocol dependencies
        run: npm install
        working-directory: protocol/contribution

  # ─── Job 2: Run Existing Protocol Tests ────────────────────────────────────
  protocol-tests:
    name: Protocol Tests
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: |
          npm install
          npm install --prefix packages/node-runtime || true
          npm install --prefix services/relay || true
          npm install --prefix protocol/contribution

      - name: Run protocol tests
        run: npm test --prefix protocol/contribution

  # ─── Job 3: Node Runtime Tests ────────────────────────────────────────────
  node-runtime-tests:
    name: Node Runtime Tests
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: |
          npm install --prefix packages/node-runtime
          npm install --prefix protocol/contribution

      - name: Create test directories
        run: mkdir -p packages/node-runtime/tests

      - name: Test identity module
        run: |
          cat > /tmp/test-identity.mjs << 'EOF'
          import { generateKeypair, generateNodeId, sign, verify, NodeIdentityManager } from 'packages/node-runtime/src/index.js';

          // Generate keypair
          const kp = generateKeypair();
          if (!kp.publicKey || !kp.secretKey) throw new Error('Keypair generation failed');

          // Generate node ID
          const id = generateNodeId(kp.publicKey, 'mood-testnet-001');
          if (!id.startsWith('mood:node:')) throw new Error('Invalid node ID format');

          // Test sign and verify
          const signature = sign('test message', kp.secretKey);
          const isValid = verify('test message', signature, kp.publicKey);
          if (!isValid) throw new Error('Verify failed for valid signature');

          // Test that invalid message fails
          const isInValid = verify('wrong message', signature, kp.publicKey);
          if (isInValid) throw new Error('Verify should fail for wrong message');

          console.log('✅ Identity module tests passed');
          EOF
          node --experimental-vm-modules /tmp/test-identity.mjs

      - name: Test invitation module
        run: |
          cat > /tmp/test-invitation.mjs << 'EOF'
          import { createInvitation, validateInvitationForEnrollment, generateOrganizationKeypair } from 'packages/node-runtime/src/invitation/index.js';

          // Generate admin keys
          const adminKeys = generateOrganizationKeypair();

          // Create invitation
          const invitation = createInvitation({
            organizationId: 'mood:org:test',
            organizationName: 'Test Org',
            organizationDomain: 'example.invalid',
            memberEmail: 'test@example.invalid',
            networkId: 'mood-testnet-001',
            issuedBy: 'admin',
            adminPublicKey: adminKeys.publicKey
          }, adminKeys.secretKey);

          if (!invitation.signature) throw new Error('Invitation not signed');

          // Validate with correct email
          const valid = validateInvitationForEnrollment(invitation, 'test@example.invalid', 'member-pub-key');
          if (!valid.valid) throw new Error('Valid enrollment failed: ' + valid.error);

          console.log('✅ Invitation module tests passed');
          EOF
          node --experimental-vm-modules /tmp/test-invitation.mjs

      - name: Test storage module
        run: |
          cat > /tmp/test-storage.mjs << 'EOF'
          import { StorageManager, STORAGE_COLLECTIONS } from 'packages/node-runtime/src/storage/index.js';

          const storage = new StorageManager({
            dataDir: '/tmp/test-storage'
          }).initialize();

          // Save and retrieve
          const result = storage.save(STORAGE_COLLECTIONS.CONTRIBUTIONS, {
            contributionId: 'test-1',
            title: 'Test Contribution',
            status: 'submitted'
          });
          if (!result.id) throw new Error('Save failed');

          const loaded = storage.load(STORAGE_COLLECTIONS.CONTRIBUTIONS, 'test-1');
          if (!loaded || loaded.title !== 'Test Contribution') throw new Error('Load failed');

          const count = storage.count(STORAGE_COLLECTIONS.CONTRIBUTIONS);
          if (count !== 1) throw new Error(`Count mismatch: ${count}`);

          // Clean up
          const fs = require('fs');
          fs.rmSync('/tmp/test-storage', { recursive: true, force: true });

          console.log('✅ Storage module tests passed');
          EOF
          node --experimental-vm-modules /tmp/test-storage.mjs

      - name: Test snapshot module
        run: |
          cat > /tmp/test-snapshot.mjs << 'EOF'
          import { computeSnapshotDigest, generateEpochId, createSnapshot } from 'packages/node-runtime/src/snapshot/index.js';

          // Generate epoch ID
          const epochId = generateEpochId(1);
          if (epochId !== 'epoch-0001') throw new Error('Invalid epoch ID');

          // Compute digest
          const contributions = [
            { contributionId: 'a', contentFingerprint: 'sha256:' + 'a'.repeat(64), status: 'verified' },
            { contributionId: 'b', contentFingerprint: 'sha256:' + 'b'.repeat(64), status: 'verified' }
          ];
          const digest1 = computeSnapshotDigest(contributions, {
            epochId: 'epoch-0001',
            epochNumber: 1,
            policyVersion: '002-draft-1',
            memberCount: 1,
            timestamp: '2026-09-03T10:00:00Z'
          });
          const digest2 = computeSnapshotDigest(contributions, {
            epochId: 'epoch-0001',
            epochNumber: 1,
            policyVersion: '002-draft-1',
            memberCount: 1,
            timestamp: '2026-09-03T10:00:00Z'
          });
          if (digest1 !== digest2) throw new Error('Digests should match');
          if (!digest1.startsWith('sha256:')) throw new Error('Invalid digest format');

          console.log('✅ Snapshot module tests passed');
          EOF
          node --experimental-vm-modules /tmp/test-snapshot.mjs

  # ─── Job 4: Three-Node Test ─────────────────────────────────────────────────
  three-node-test:
    name: Three-Node Federated Test
    runs-on: ubuntu-latest
    needs: [install, node-runtime-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: |
          npm install --prefix packages/node-runtime
          npm install --prefix protocol/contribution

      - name: Run three-node test
        run: |
          mkdir -p tmp/three-node-test
          node testnet/three-node/run-three-node-test.mjs

      - name: Verify proof bundle was created
        run: |
          if [ ! -d "tmp/three-node-test/output" ]; then
            echo "ERROR: Proof bundle directory not created"
            exit 1
          fi
          if [ ! -f "tmp/three-node-test/output/proof-bundle.json" ]; then
            echo "ERROR: proof-bundle.json not created"
            exit 1
          fi
          if [ ! -f "tmp/three-node-test/output/TEST_REPORT.md" ]; then
            echo "ERROR: TEST_REPORT.md not created"
            exit 1
          fi
          echo "✅ Three-node test artifacts verified"

  # ─── Job 5: Lint and Code Quality ───────────────────────────────────────────
  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Check for forbidden imports in node code
        run: |
          # Verify no production-only operations in node code
          echo "Checking node-runtime for forbidden patterns..."
          if grep -r 'wallet_client\|createWalletClient\|sendTransaction' packages/node-runtime/src/ 2>/dev/null; then
            echo "ERROR: wallet/signing operations found"
            exit 1
          fi
          echo "✅ No forbidden wallet/transaction imports"

      - name: Check for secret references
        run: |
          # Make sure real emails are not in code
          if grep -r 'rongjingmusic.com' packages/ apps/ services/ testnet/ 2>/dev/null; then
            echo "ERROR: Real email domain found in source"
            exit 1
          fi
          echo "✅ No real email domains in source"

      - name: Check for unsafe operations
        run: |
          # Verify no SSH, shell, or wallet operations
          echo "Checking for unsafe operations..."
          if grep -r 'exec(\|spawn(\|child_process\|ssh.connect' packages/node-runtime/src/ apps/mood-desktop/desktop/ apps/mood-desktop/renderer/ 2>/dev/null; then
            echo "WARN: shell execution imports detected"
          fi
          echo "✅ Lint check completed"

  # ─── Job 6: Web Build (Placeholder - exists in main CI) ─────────────────────
  web:
    name: Web Build
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Build web (if exists)
        continue-on-error: true
        run: |
          if [ -f "apps/web/package.json" ]; then
            cd apps/web
            npm install
            npm run build || echo "Web build skipped/failed (not required for node alpha)"
          else
            echo "No web app to build"
          fi

  # ─── Final Status ───────────────────────────────────────────────────────────
  status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [protocol-tests, node-runtime-tests, three-node-test, lint, web]
    if: always()
    steps:
      - name: Report
        run: |
          if [ "${{ needs.protocol-tests.result }}" == "success" ] && \
             [ "${{ needs.node-runtime-tests.result }}" == "success" ] && \
             [ "${{ needs.three-node-test.result }}" == "success" ] && \
             [ "${{ needs.lint.result }}" == "success" ]; then
            echo "✅ All critical CI jobs passed"
            exit 0
          else
            echo "❌ Some CI jobs failed"
            exit 1
          fi
